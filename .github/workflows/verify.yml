name: Verify source demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Install tested dependencies
        run: python -m pip install -r requirements-tested.txt
      - name: Tests without provider credentials
        run: python -m pytest -q --tb=short --basetemp .pytest-tmp-ci
      - name: Audit saved hosted fixtures without inference
        run: python -m water_diagnostics validate-demo --mode saved
      - name: Check the additional river week without inference
        run: python scripts/evaluate_river_holdout.py
      - name: Verify the source package
        run: python scripts/build_demo.py
